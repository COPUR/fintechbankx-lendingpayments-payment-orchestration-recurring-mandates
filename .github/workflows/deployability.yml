name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag payment-recurring-mandates-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' payment-recurring-mandates-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Lint and render chart
        run: |
          chart=deploy/helm/payment-recurring-mandates-service
          args="--namespace payments \
            --set image.repository=ci/payment-recurring-mandates-service --set image.tag=${{ github.sha }} \
            --set externalSecret.remoteSecretName=dev/payment-recurring-mandates-service/db-app \
            --set externalSecret.serviceClientSecretName=dev/payment-recurring-mandates-service/oidc-client \
            --set migration.remoteSecretName=dev/payment-recurring-mandates-service/db-migration \
            --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db_pay_recurring_mandates_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem \
            --set config.KAFKA_BOOTSTRAP_SERVERS=kafka.ci:9098 \
            --set config.OIDC_ISSUER_URI=https://idp.ci/realms/fintechbankx \
            --set config.OIDC_JWK_SET_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/certs \
            --set config.OIDC_TOKEN_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/token \
            --set config.ACCOUNTS_SERVICE_BASE_URL=http://accounts.ci:8080"
          helm lint "$chart" $args
          helm template ci "$chart" $args > /dev/null
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args > /dev/null
          # The pods verify Aurora's certificate against the platform RDS CA bundle.
          grep -q "name: rds-ca-bundle" <<<"$(helm template ci "$chart" $args)"
          # Platform chart convention (cicd-templates 4f0f266): bundle at /etc/fintechbankx/rds-ca, exported as DB_SSL_ROOT_CERT
          # to the pods and the migration Job.
          grep -q 'mountPath: "/etc/fintechbankx/rds-ca"' <<<"$(helm template ci "$chart" $args)"
          test "$(grep -A1 'name: DB_SSL_ROOT_CERT' <<<"$(helm template ci "$chart" $args)" | grep -c 'value: "/etc/fintechbankx/rds-ca/global-bundle.pem"')" -eq 2
          if helm template ci "$chart" $args --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db > /dev/null 2>&1; then
            echo "chart rendered a DB_URL without sslmode" >&2; exit 1
          fi
          if helm template ci "$chart" $args --set-string "config.DB_URL=jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=/etc/ssl/rds/global-bundle.pem" > /dev/null 2>&1; then
            echo "chart rendered a DB_URL whose sslrootcert is not the mounted bundle" >&2; exit 1
          fi
          if helm template ci "$chart" $args --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db?sslmode=require > /dev/null 2>&1; then
            echo "chart rendered a DB_URL without sslmode=verify-full and the RDS CA bundle" >&2; exit 1
          fi
          # Flyway runs only in the hook Job, as the schema owner; the pods never get that secret.
          job="$(helm template ci "$chart" $args --show-only templates/migration-job.yaml)"
          grep -q 'helm.sh/hook: pre-install,pre-upgrade' <<<"$job"
          grep -q 'args: \["migrate"\]' <<<"$job"
          grep -q 'key: "dev/payment-recurring-mandates-service/db-migration"' <<<"$job"
          deployment="$(helm template ci "$chart" $args --show-only templates/deployment.yaml)"
          grep -A1 'name: SPRING_FLYWAY_ENABLED' <<<"$deployment" | grep -q 'value: "false"'
          if grep -q 'db-migration' <<<"$deployment"; then echo "the service pods reference the migration secret" >&2; exit 1; fi
          if helm template ci "$chart" $args --set migration.remoteSecretName= > /dev/null 2>&1; then
            echo "chart rendered without the migration secret" >&2; exit 1
          fi
          # Platform admission policy: every ExternalSecret carries
          # app.kubernetes.io/name=<service account> and reads only <env>/<service account>/.
          rendered="$(helm template ci "$chart" $args)"
          sa=payment-recurring-mandates-service
          # remoteRef keys are rendered quoted (every interpolated value is); compare them unquoted.
          keys="$(grep -E '^ +key: ' <<<"$rendered" | awk '{print $2}' | tr -d '"')"
          test -n "$keys"
          if grep -vE "^(dev|staging|prod)/$sa/[a-z0-9-]+$" <<<"$keys"; then
            echo "ExternalSecret remoteRef key outside <env>/$sa/" >&2; exit 1
          fi
          if [ "$(grep -c '^kind: ExternalSecret' <<<"$rendered")" -ne "$(awk '/^kind: ExternalSecret/{es=1} /^---/{es=0} es && /app.kubernetes.io\/name: payment-recurring-mandates-service$/{n++; es=0} END{print n+0}' <<<"$rendered")" ]; then
            echo "an ExternalSecret lacks app.kubernetes.io/name=$sa" >&2; exit 1
          fi
          if helm template ci "$chart" $args --set externalSecret.remoteSecretName=dev-$sa/db-app > /dev/null 2>&1; then
            echo "chart rendered a remoteRef key outside <env>/$sa/" >&2; exit 1
          fi
          # Mesh egress (allow-egress-aurora) selects app.kubernetes.io/name only: the hook Job pod
          # carries the SA name; component labels keep it out of the API pods' selectors. Only the
          # API pods carry fintechbankx.io/service-id (observability scrape and alert key).
          # Parked-outbox alerting is the platform's OutboxEventsParked rule; the chart ships none.
          if grep -qE 'kind: PrometheusRule|outbox_parked' <<<"$rendered"; then
            echo "the chart renders its own outbox alert rule; use the platform OutboxEventsParked" >&2; exit 1
          fi
          # Micrometer common tags: squad = the release namespace, app = the service account.
          grep -q 'METRICS_TAG_SQUAD: "payments"' <<<"$rendered"
          grep -q "METRICS_TAG_APP: \"$sa\"" <<<"$rendered"
          python scripts/ci/helm-selector-check.py "$sa" svc-pay-recurring-mandates <<<"$rendered"
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args | python scripts/ci/helm-selector-check.py "$sa" svc-pay-recurring-mandates
      # templates/_fbx_helpers.tpl is the platform's charts/fintechbankx-service/templates/_helpers.tpl
      # at cicd-templates commit a4f0072, byte for byte (fbx.guard and the helpers it calls); an edited
      # copy fails here. Re-copy and update the sum here and in the README together.
      - name: Vendored guard matches cicd-templates a4f0072
        run: |
          sha256sum -c --strict - <<'SUMS'
          1fd684735383301baf3052c5d8978dd86edee1ac1c66ebfb944a8a6a166f4c92  deploy/helm/payment-recurring-mandates-service/templates/_fbx_helpers.tpl
          SUMS
      - name: Missing required config fails the render
        run: |
          if helm template ci deploy/helm/payment-recurring-mandates-service \
               --set image.repository=ci/x --set image.tag=x \
               --set externalSecret.remoteSecretName=a --set externalSecret.serviceClientSecretName=b > /dev/null 2>&1; then
            echo "chart rendered without DB_URL / Kafka / OIDC / accounts settings"; exit 1
          fi
      # Governance round 3 (2b) and round 6 (guardrail 4a): no values override can move the
      # service off the checked JDBC URL or switch its TLS assertion off. The vendored platform
      # guard (templates/_fbx_helpers.tpl, fbx.guard, called through the adapter in
      # templates/_helpers.tpl mandates.guard) checks each `config` key and `extraEnv` name as given
      # and in its relaxed-binding canonical form and refuses Spring datasource/Flyway/Liquibase/R2DBC
      # properties, spring.application.json, jdbc_url, sslfactory, sslhostnameverifier,
      # sslpasswordcallback, sslmode/sslrootcert names, spring.config.*, spring.profiles.*,
      # spring.ssl.*, *ssl.bundle* and fintechbankx.tls.*; this chart adds spring.kafka.*security.protocol
      # and spring.kafka.properties.* by name. The only configtree the platform allows is one the chart
      # itself renders on optional:configtree:/etc/fintechbankx/config/; this chart renders none. The
      # Kafka profile is the validated value kafka.profile (fbx.kafkaProfile through kafka.runtime).
      - name: Spring config redirection fails the render
        run: |
          chart=deploy/helm/payment-recurring-mandates-service
          args="--namespace payments \
            --set image.repository=ci/payment-recurring-mandates-service --set image.tag=${{ github.sha }} \
            --set externalSecret.remoteSecretName=dev/payment-recurring-mandates-service/db-app \
            --set externalSecret.serviceClientSecretName=dev/payment-recurring-mandates-service/oidc-client \
            --set migration.remoteSecretName=dev/payment-recurring-mandates-service/db-migration \
            --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db_pay_recurring_mandates_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem \
            --set config.KAFKA_BOOTSTRAP_SERVERS=kafka.ci:9098 \
            --set config.OIDC_ISSUER_URI=https://idp.ci/realms/fintechbankx \
            --set config.OIDC_JWK_SET_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/certs \
            --set config.OIDC_TOKEN_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/token \
            --set config.ACCOUNTS_SERVICE_BASE_URL=http://accounts.ci:8080"
          refused_names="SPRING_CONFIG_IMPORT spring_config_location Spring_Config_Additional_Location SPRING-CONFIG-IMPORT \
                     SPRING_CONFIG_IMPORT_0 SPRING_CONFIG_LOCATION_1 SPRING_CONFIG_ADDITIONAL_LOCATION_0 SPRING_CONFIG_IMPORT_ SPRING_CONFIG_NAME \
                     SPRING_PROFILES_ACTIVE SPRING_PROFILES_INCLUDE SPRING_PROFILES_DEFAULT SPRING_PROFILES_ACTIVE_0 SPRING_PROFILES_INCLUDE_0 \
                     SPRING_PROFILES_GROUP_KAFKA_MSK spring-profiles-group-kafka-msk SPRING_APPLICATION_JSON spring-application-json \
                     SPRING_DATASOURCE_URL SPRING_DATASOURCE_HIKARI_JDBC_URL SPRING_DATASOURCE_HIKARI_JDBCURL SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSLFACTORY \
                     SPRING_FLYWAY_URL SPRING_FLYWAY_USER SPRING_LIQUIBASE_URL SPRING_R2DBC_URL JDBC_URL REPORTING_JDBC_URL MY_SSLFACTORY MY_SSLHOSTNAMEVERIFIER \
                     FINTECHBANKX_TLS_ENFORCE FINTECHBANKX_TLS_ENFORCE_0 fintechbankx-tls-enforce FINTECHBANKX_TLS_SOMETHING \
                     SPRING_KAFKA_SECURITY_PROTOCOL SPRING_KAFKA_PRODUCER_SECURITY_PROTOCOL SPRING_KAFKA_CONSUMER_SECURITY_PROTOCOL \
                     SPRING_KAFKA_PRODUCER_PROPERTIES_SECURITY_PROTOCOL SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL SPRING_KAFKA_PROPERTIES_SASL_MECHANISM"
          # Dotted spellings (helm --set needs the dots escaped).
          refused_dotted='spring\.config\.import spring\.config\.import\.0 spring\.config\.name spring\.profiles\.active spring\.profiles\.default \
                     spring\.profiles\.group\.kafka-msk spring\.application\.json spring\.datasource\.hikari\.jdbc-url spring\.flyway\.url \
                     fintechbankx\.tls\.enforce spring\.kafka\.properties\.security\.protocol spring\.kafka\.producer\.security\.protocol'
          for key in $refused_names $refused_dotted; do
            if helm template ci "$chart" $args --set-string "config.$key=optional:configtree:/etc/fintechbankx/config/" > /dev/null 2>&1; then
              echo "chart rendered config.$key" >&2; exit 1
            fi
            if helm template ci "$chart" $args --set-string "extraEnv[0].name=$key" --set-string 'extraEnv[0].value=x' > /dev/null 2>&1; then
              echo "chart rendered extraEnv $key (value)" >&2; exit 1
            fi
            if helm template ci "$chart" $args --set-string "extraEnv[0].name=$key" \
                 --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=s' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=k' > /dev/null 2>&1; then
              echo "chart rendered extraEnv $key (valueFrom)" >&2; exit 1
            fi
          done
          # The exception of the datasource rule: the credential keys the ExternalSecret materialises.
          helm template ci "$chart" $args --show-only templates/deployment.yaml \
            --set-string 'extraEnv[0].name=SPRING_DATASOURCE_USERNAME' --set-string 'extraEnv[0].value=x' | grep -q 'name: SPRING_DATASOURCE_USERNAME'
          # The chart's own SPRING_PROFILES_ACTIVE comes from kafka.profile, validated against the
          # Kafka profiles in the image; config.SPRING_PROFILES_ACTIVE is refused above in every spelling.
          grep -q 'SPRING_PROFILES_ACTIVE: "kafka-msk"' <<<"$(helm template ci "$chart" $args)"
          grep -q 'SPRING_PROFILES_ACTIVE: "kafka-strimzi"' <<<"$(helm template ci "$chart" $args --set kafka.profile=kafka-strimzi)"
          for profile in local 'kafka-msk\,local' 'kafka-msk local' default '' 'kafka-msk\,kafka-strimzi'; do
            if helm template ci "$chart" $args --set-string "kafka.profile=$profile" > /dev/null 2>&1; then
              echo "chart rendered kafka.profile=$profile" >&2; exit 1
            fi
          done
          if helm template ci "$chart" $args --set-string 'config.SPRING_PROFILES_ACTIVE=kafka-msk\,local' > /dev/null 2>&1; then
            echo "chart rendered the local profile" >&2; exit 1
          fi
          # KAFKA_SECURITY_PROTOCOL is rendered from kafka.profile (SASL_SSL with kafka-msk, SSL with
          # kafka-strimzi); a config value may only repeat the protocol of the profile (fbx.validateKafkaTls).
          grep -q 'KAFKA_SECURITY_PROTOCOL: "SASL_SSL"' <<<"$(helm template ci "$chart" $args)"
          grep -q 'KAFKA_SECURITY_PROTOCOL: "SSL"' <<<"$(helm template ci "$chart" $args --set kafka.profile=kafka-strimzi)"
          for protocol in PLAINTEXT SASL_PLAINTEXT '' SSL; do
            if helm template ci "$chart" $args --set-string "config.KAFKA_SECURITY_PROTOCOL=$protocol" > /dev/null 2>&1; then
              echo "chart rendered KAFKA_SECURITY_PROTOCOL=$protocol with kafka-msk" >&2; exit 1
            fi
          done
          if helm template ci "$chart" $args --set kafka.profile=kafka-strimzi --set-string config.KAFKA_SECURITY_PROTOCOL=SASL_SSL > /dev/null 2>&1; then
            echo "chart rendered KAFKA_SECURITY_PROTOCOL=SASL_SSL with kafka-strimzi" >&2; exit 1
          fi
          helm template ci "$chart" $args --set kafka.profile=kafka-strimzi --set-string config.KAFKA_SECURITY_PROTOCOL=SSL > /dev/null
          if helm template ci "$chart" $args --set-string 'extraEnv[0].name=KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM' --set-string 'extraEnv[0].value=' > /dev/null 2>&1; then
            echo "chart rendered an empty endpoint identification algorithm" >&2; exit 1
          fi
          # The chart itself renders no SPRING_CONFIG_* setting; a harmless extraEnv entry still reaches the API pods.
          if grep -qi 'SPRING_CONFIG' <<<"$(helm template ci "$chart" $args)"; then
            echo "the chart renders a SPRING_CONFIG_* setting" >&2; exit 1
          fi
          helm template ci "$chart" $args --show-only templates/deployment.yaml \
            --set-string 'extraEnv[0].name=FEATURE_X' --set-string 'extraEnv[0].value=on' | grep -q 'name: FEATURE_X'

      # Round 6, payments review: Kubernetes `env` wins over the ConfigMap's envFrom, so extraEnv may
      # not carry DB_URL (value or valueFrom). JVM option variables need a literal value, checked by
      # mandates.validateJvmOptions (cicd-templates 2caa48f fbx.validateJvmOptions plus fintechbankx and kafka).
      - name: extraEnv cannot replace the JDBC URL or steer the JVM past the checks
        run: |
          chart=deploy/helm/payment-recurring-mandates-service
          args="--namespace payments \
            --set image.repository=ci/payment-recurring-mandates-service --set image.tag=${{ github.sha }} \
            --set externalSecret.remoteSecretName=dev/payment-recurring-mandates-service/db-app \
            --set externalSecret.serviceClientSecretName=dev/payment-recurring-mandates-service/oidc-client \
            --set migration.remoteSecretName=dev/payment-recurring-mandates-service/db-migration \
            --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db_pay_recurring_mandates_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem \
            --set config.KAFKA_BOOTSTRAP_SERVERS=kafka.ci:9098 \
            --set config.OIDC_ISSUER_URI=https://idp.ci/realms/fintechbankx \
            --set config.OIDC_JWK_SET_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/certs \
            --set config.OIDC_TOKEN_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/token \
            --set config.ACCOUNTS_SERVICE_BASE_URL=http://accounts.ci:8080"
          good='jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          for name in DB_URL db_url Db-Url; do
            if helm template ci "$chart" $args --set-string "extraEnv[0].name=$name" --set-string "extraEnv[0].value=$good" > /dev/null 2>&1; then
              echo "chart rendered extraEnv $name with a value" >&2; exit 1
            fi
            if helm template ci "$chart" $args --set-string "extraEnv[0].name=$name" \
                 --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=s' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=k' > /dev/null 2>&1; then
              echo "chart rendered extraEnv $name with valueFrom" >&2; exit 1
            fi
          done
          for jvm in JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS; do
            for value in '-Dfintechbankx.tls.enforce=false' '-Dspring.datasource.url=jdbc:postgresql://x/y' '-Dspring.kafka.security.protocol=PLAINTEXT' \
                         '-Dspring.kafka.properties.security.protocol=PLAINTEXT' '-Djavax.net.ssl.trustStore=/tmp/x' '-Dspring.profiles.active=local' \
                         '-Dspring.config.import=optional:configtree:/tmp/' '-Dspring.application.json={}' '@/tmp/opts' '-XX:MaxRAMPercentage=70 @/tmp/opts' \
                         '-XX:VMOptionsFile=/tmp/opts' '-XX:Flags=/tmp/flags' '-DFINTECHBANKX_TLS_ENFORCE=false' '-Dspring.flyway.url=x'; do
              if helm template ci "$chart" $args --set-string "extraEnv[0].name=$jvm" --set-string "extraEnv[0].value=$value" > /dev/null 2>&1; then
                echo "chart rendered extraEnv $jvm=$value" >&2; exit 1
              fi
              if helm template ci "$chart" $args --set-string "config.$jvm=$value" > /dev/null 2>&1; then
                echo "chart rendered config.$jvm=$value" >&2; exit 1
              fi
            done
            if helm template ci "$chart" $args --set-string "extraEnv[0].name=$jvm" \
                 --set-string 'extraEnv[0].valueFrom.configMapKeyRef.name=c' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.key=k' > /dev/null 2>&1; then
              echo "chart rendered extraEnv $jvm from valueFrom" >&2; exit 1
            fi
          done
          # A JVM option that steers nothing the checks cover still renders.
          helm template ci "$chart" $args --show-only templates/deployment.yaml \
            --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError' \
            | grep -q 'name: JAVA_TOOL_OPTIONS'

      # Round 6: every PostgreSQL JDBC URL in values (config.DB_URL, any other config value, any
      # extraEnv value) is parsed the way PgJDBC reads it (mandates.validateJdbcUrl, ported from
      # cicd-templates 2caa48f fbx.validateJdbcUrl), not searched for a substring: one lower-case
      # sslmode=verify-full, one sslrootcert equal to the mounted bundle, no sslfactory, sslfactoryarg,
      # sslhostnameverifier, sslpasswordcallback or service, no percent-encoded '=' or '&', no TLS
      # key before the '?', and plain [A-Za-z0-9_.-] parameter names.
      - name: JDBC URLs are parsed strictly
        run: |
          chart=deploy/helm/payment-recurring-mandates-service
          args="--namespace payments \
            --set image.repository=ci/payment-recurring-mandates-service --set image.tag=${{ github.sha }} \
            --set externalSecret.remoteSecretName=dev/payment-recurring-mandates-service/db-app \
            --set externalSecret.serviceClientSecretName=dev/payment-recurring-mandates-service/oidc-client \
            --set migration.remoteSecretName=dev/payment-recurring-mandates-service/db-migration \
            --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db_pay_recurring_mandates_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem \
            --set config.KAFKA_BOOTSTRAP_SERVERS=kafka.ci:9098 \
            --set config.OIDC_ISSUER_URI=https://idp.ci/realms/fintechbankx \
            --set config.OIDC_JWK_SET_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/certs \
            --set config.OIDC_TOKEN_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/token \
            --set config.ACCOUNTS_SERVICE_BASE_URL=http://accounts.ci:8080"
          ca=/etc/fintechbankx/rds-ca/global-bundle.pem
          base=jdbc:postgresql://db.ci:5432/db
          refused_urls=(
            "$base?sslmode=verify-full&sslrootcert=$ca&sslmode=disable"                      # a later sslmode wins in PgJDBC
            "$base?sslmode=disable&sslmode=verify-full&sslrootcert=$ca"                      # an earlier one: still two
            "$base?sslrootcert=/tmp/decoy.pem&sslmode=verify-full&sslrootcert=$ca"          # decoy sslrootcert before the real one
            "$base?sslmode=verify-full&sslrootcert=$ca&sslrootcert=/tmp/decoy.pem"
            "$base?sslmode=verify-full&sslrootcert=$ca&sslfactory=org.postgresql.ssl.NonValidatingFactory"
            "$base?sslmode=verify-full&sslrootcert=$ca&sslfactoryarg=x"
            "$base?sslmode=verify-full&sslrootcert=$ca&sslhostnameverifier=x.Y"
            "$base?sslmode=verify-full&sslrootcert=$ca&sslpasswordcallback=x"
            "$base?sslmode=verify-full&sslrootcert=$ca&service=prod"
            "$base?sslmode=require&applicationName=sslmode=verify-full&sslrootcert=$ca"      # substring decoy inside another value
            "$base?SSLMODE=verify-full&sslrootcert=$ca"                                      # PgJDBC ignores upper case: effective sslmode is the default
            "$base?SslMode=verify-full&sslrootcert=$ca"
            "$base?sslmode=verify-full&SSLROOTCERT=$ca"
            "$base?sslmode=VERIFY-FULL&sslrootcert=$ca"
            "jdbc:postgresql://db.ci:5432/db&sslmode=disable?sslmode=verify-full&sslrootcert=$ca"   # a TLS key before the '?'
            "jdbc:postgresql://db.ci:5432/db;sslfactory=x?sslmode=verify-full&sslrootcert=$ca"
            "$base?sslmode=verify-full&sslrootcert=$ca&x=a%3Db"                              # percent-encoded '='
            "$base?sslmode=verify-full%26sslmode=disable&sslrootcert=$ca"                   # percent-encoded '&'
            "$base?ssl%6Dode=disable&sslmode=verify-full&sslrootcert=$ca"                    # a parameter name that is not plain
            "$base?sslmode=verify-full&sslrootcert=/etc/ssl/rds/global-bundle.pem"
            "$base?sslmode=verify-full"
            "$base?sslmode=verify-ca&sslrootcert=$ca"
            "$base?sslmode=require"
            "$base"
            "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&"           # fine for PgJDBC; kept as a positive below
          )
          unset 'refused_urls[-1]'
          for url in "${refused_urls[@]}"; do
            if helm template ci "$chart" $args --set-string "config.DB_URL=$url" > /dev/null 2>&1; then
              echo "chart rendered config.DB_URL=$url" >&2; exit 1
            fi
          done
          # The same parser applies to every other PostgreSQL URL a value can carry.
          for url in "$base?sslmode=require" "$base?sslmode=verify-full&sslrootcert=$ca&sslfactory=org.postgresql.ssl.NonValidatingFactory" \
                     "jdbc:p6spy:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca&sslmode=disable" \
                     " $base?SSLMODE=verify-full&sslrootcert=$ca"; do
            if helm template ci "$chart" $args --set-string "config.REPORTING_DB_URL=$url" > /dev/null 2>&1; then
              echo "chart rendered config.REPORTING_DB_URL=$url" >&2; exit 1
            fi
            if helm template ci "$chart" $args --set-string 'extraEnv[0].name=REPORTING_URL' --set-string "extraEnv[0].value=$url" > /dev/null 2>&1; then
              echo "chart rendered extraEnv REPORTING_URL=$url" >&2; exit 1
            fi
          done
          if helm template ci "$chart" $args --set-string "config.DB_URL=jdbc:mysql://db.ci:3306/db?sslMode=VERIFY_IDENTITY" > /dev/null 2>&1; then
            echo "chart rendered a DB_URL that is not a PostgreSQL URL" >&2; exit 1
          fi
          # Accepted: the parameters in either order, a trailing '&', other plain parameters.
          for url in "$base?sslrootcert=$ca&sslmode=verify-full" "$base?sslmode=verify-full&sslrootcert=$ca&" \
                     "$base?sslmode=verify-full&sslrootcert=$ca&ApplicationName=mandates&reWriteBatchedInserts=true"; do
            helm template ci "$chart" $args --set-string "config.DB_URL=$url" > /dev/null
          done

      # What the a4f0072 guard covers beyond 2caa48f: SSL bundle names, DB_SSL_ROOT_CERT (rendered by the
      # chart; an extraEnv of that name would replace it), -Djdk.tls.* and -Djava.security.properties,
      # '$(' in an extraEnv value (Kubernetes expands it after the check), '${' in a JDBC URL, envFrom
      # and dataFrom values (keys the guard never sees), and key shapes. The templates quote every key
      # and value they interpolate, so a newline in a value cannot add a key either.
      - name: SSL bundles, DB_SSL_ROOT_CERT, JVM TLS properties, variable references and key injection fail the render
        run: |
          chart=deploy/helm/payment-recurring-mandates-service
          args="--namespace payments \
            --set image.repository=ci/payment-recurring-mandates-service --set image.tag=${{ github.sha }} \
            --set externalSecret.remoteSecretName=dev/payment-recurring-mandates-service/db-app \
            --set externalSecret.serviceClientSecretName=dev/payment-recurring-mandates-service/oidc-client \
            --set migration.remoteSecretName=dev/payment-recurring-mandates-service/db-migration \
            --set-string config.DB_URL=jdbc:postgresql://db.ci:5432/db_pay_recurring_mandates_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem \
            --set config.KAFKA_BOOTSTRAP_SERVERS=kafka.ci:9098 \
            --set config.OIDC_ISSUER_URI=https://idp.ci/realms/fintechbankx \
            --set config.OIDC_JWK_SET_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/certs \
            --set config.OIDC_TOKEN_URI=https://idp.ci/realms/fintechbankx/protocol/openid-connect/token \
            --set config.ACCOUNTS_SERVICE_BASE_URL=http://accounts.ci:8080"
          ca=/etc/fintechbankx/rds-ca/global-bundle.pem
          for key in SPRING_SSL_BUNDLE_PEM_RDS_TRUSTSTORE_CERTIFICATE 'spring\.ssl\.bundle\.jks\.x\.truststore\.location' SPRING_KAFKA_SSL_BUNDLE \
                     SPRING_DATA_MONGODB_SSL_BUNDLE 'spring\.kafka\.ssl\.bundle' spring-ssl-bundle-pem-x DB_SSL_ROOT_CERT db-ssl-root-cert PGSSLROOTCERT \
                     OPF_DB_SSL_MODE 'spring\.pro-files\.active' 'spring_config_activate_on-profile' 'SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG'; do
            if helm template ci "$chart" $args --set-string "config.$key=x" > /dev/null 2>&1; then
              echo "chart rendered config.$key" >&2; exit 1
            fi
            if helm template ci "$chart" $args --set-string "extraEnv[0].name=$key" --set-string 'extraEnv[0].value=x' > /dev/null 2>&1; then
              echo "chart rendered extraEnv $key" >&2; exit 1
            fi
          done
          for value in '-Djdk.tls.client.protocols=TLSv1' '-Djdk.tls.trustNameService=true' '-Djava.security.properties=/tmp/java.security' \
                       '-Djdk.internal.httpclient.disableHostnameVerification=true' '-Dspring.ssl.bundle.pem.x.truststore.certificate=/tmp/x' \
                       '-XX:MaxRAMPercentage=70 $(JAVA_EXTRA)' '-XX:MaxRAMPercentage=${PCT}' '"@/tmp/opts"'; do
            if helm template ci "$chart" $args --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string "extraEnv[0].value=$value" > /dev/null 2>&1; then
              echo "chart rendered JAVA_TOOL_OPTIONS=$value" >&2; exit 1
            fi
          done
          # $(VAR) in any extraEnv value: Kubernetes would expand it from earlier env entries and envFrom keys.
          if helm template ci "$chart" $args --set-string 'extraEnv[0].name=REPORT_URL' --set-string 'extraEnv[0].value=$(DB_URL)&sslmode=disable' > /dev/null 2>&1; then
            echo "chart rendered an extraEnv value with \$(" >&2; exit 1
          fi
          # ${...} in the JDBC URL: Spring resolves it after the check.
          for url in "jdbc:postgresql://db.ci:5432/db?sslmode=verify-full&sslrootcert=$ca\${EXTRA}" 'jdbc:postgresql://${DB_HOST}:5432/db?sslmode=verify-full&sslrootcert='"$ca"; do
            if helm template ci "$chart" $args --set-string "config.DB_URL=$url" > /dev/null 2>&1; then
              echo "chart rendered config.DB_URL=$url" >&2; exit 1
            fi
          done
          # envFrom-like values and an ExternalSecret dataFrom load keys the guard never sees; the chart renders none of them.
          for setting in 'envFrom[0].configMapRef.name=other' 'extraEnvFrom[0].secretRef.name=other' 'externalSecret.dataFrom[0].extract.key=dev/payment-recurring-mandates-service/all'; do
            if helm template ci "$chart" $args --set-string "$setting" > /dev/null 2>&1; then
              echo "chart rendered with $setting" >&2; exit 1
            fi
          done
          # Template interpolation: a config key carrying a newline must not become a second key.
          tmp="$(mktemp -d)"
          printf 'config:\n  "HARMLESS\\nSPRING_CONFIG_IMPORT": "optional:configtree:/etc/fintechbankx/config/"\n' > "$tmp/key.yaml"
          if helm template ci "$chart" $args -f "$tmp/key.yaml" > "$tmp/key.out" 2>&1; then
            echo "chart rendered a config key containing a newline" >&2; exit 1
          fi
          grep -q 'is not a ConfigMap key' "$tmp/key.out"
          # A value carrying a newline stays one quoted value: no extra ConfigMap key appears.
          printf 'config:\n  HARMLESS: "x\\nSPRING_CONFIG_IMPORT: optional:configtree:/etc/fintechbankx/config/"\n' > "$tmp/value.yaml"
          helm template ci "$chart" $args -f "$tmp/value.yaml" --show-only templates/configmap.yaml > "$tmp/value.out"
          python - "$tmp/value.out" <<'PY'
          import sys, yaml
          cm = yaml.safe_load(open(sys.argv[1]))
          keys = set(cm["data"])
          assert "SPRING_CONFIG_IMPORT" not in keys, keys
          assert cm["data"]["HARMLESS"].startswith("x\n"), cm["data"]["HARMLESS"]
          PY
          # extraEnv names and the ExternalSecret key shapes: not a Kubernetes key, not rendered.
          if helm template ci "$chart" $args --set-string 'extraEnv[0].name=FOO BAR' --set-string 'extraEnv[0].value=x' > /dev/null 2>&1; then
            echo "chart rendered an extraEnv name with white space" >&2; exit 1
          fi

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
