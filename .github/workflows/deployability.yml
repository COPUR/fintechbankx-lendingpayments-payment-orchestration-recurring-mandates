          # JVM options cannot carry them either (ssl, kafka, mongodb and the TLS variable names are refused in a JVM option value).
          refuse 'extraEnv\.JDK_JAVA_OPTIONS must not mention' --set-string 'extraEnv[0].name=JDK_JAVA_OPTIONS' --set-string 'extraEnv[0].value=-Dspring.kafka.properties.ssl.truststore.location=/etc/other/any.jks'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention' --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Dspring.kafka.ssl.trust-store-location=file:/etc/other/any.jks'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention' --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-DKAFKA_TLS_CA=/etc/other/any.pem'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention .*kafka' --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Dspring.kafka.bootstrap-servers=other.example.internal:9092'
          refuse 'config\.JDK_JAVA_OPTIONS must not mention .*kafka' --set-string 'config.JDK_JAVA_OPTIONS=-Dspring.Kaf_ka.producer.acks=0'
          refuse 'extraEnv\._JAVA_OPTIONS must not mention .*kafka' --set-string 'extraEnv[0].name=_JAVA_OPTIONS' --set-string 'extraEnv[0].value=-Dlogging.level.org.apache.kafka=DEBUG'
          # An empty endpoint identification algorithm turns broker host name verification off; the value is checked on both routes.
          refuse 'config\.SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM must be https' --set-string 'config.SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM='
          # KAFKA_TLS_CERT, KAFKA_TLS_KEY and KAFKA_TLS_CA (the kafka-strimzi profile reads them as ${KAFKA_TLS_*}) reach the pod only from a Secret.
          strimzi='--set-string kafka.profile=kafka-strimzi'
          # shellcheck disable=SC2086
          for name in KAFKA_TLS_CERT KAFKA_TLS_KEY KAFKA_TLS_CA; do
            helm template ci "$chart" $args $strimzi --show-only templates/deployment.yaml \
              --set-string "extraEnv[0].name=$name" --set-string "extraEnv[0].valueFrom.secretKeyRef.name=kafka-client-tls" --set-string "extraEnv[0].valueFrom.secretKeyRef.key=k" \
              | grep -A3 "name: $name" | grep -q 'secretKeyRef'
          done
          refuse 'extraEnv KAFKA_TLS_CA must come from valueFrom\.secretKeyRef' --set-string kafka.profile=kafka-strimzi \
            --set-string 'extraEnv[0].name=KAFKA_TLS_CA' --set-string 'extraEnv[0].value=-----BEGIN CERTIFICATE-----'
          refuse 'extraEnv KAFKA_TLS_CERT must come from valueFrom\.secretKeyRef' --set-string kafka.profile=kafka-strimzi \
            --set-string 'extraEnv[0].name=KAFKA_TLS_CERT' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.key=user.crt'
          refuse 'extraEnv KAFKA_TLS_KEY must come from valueFrom\.secretKeyRef' --set-string kafka.profile=kafka-strimzi \
            --set-string 'extraEnv[0].name=KAFKA_TLS_KEY' --set-string 'extraEnv[0].valueFrom.fieldRef.fieldPath=metadata.name'
          printf 'kafka:\n  profile: kafka-strimzi\nextraEnv:\n  - name: KAFKA_TLS_CA\n    value: ""\n    valueFrom:\n      secretKeyRef: {name: kafka-client-tls, key: ca.crt}\n' > "$tmp/tls-empty.yaml"
          refuse 'extraEnv KAFKA_TLS_CA must come from valueFrom\.secretKeyRef' -f "$tmp/tls-empty.yaml"
          refuse 'config\.KAFKA_TLS_CA is not allowed: .*Secret' --set-string kafka.profile=kafka-strimzi --set-string 'config.KAFKA_TLS_CA=-----BEGIN CERTIFICATE-----'
          refuse 'config\.KAFKA_TLS_CERT is not allowed' --set-string kafka.profile=kafka-strimzi --set-string 'config.KAFKA_TLS_CERT=-----BEGIN CERTIFICATE-----'
          refuse 'config\.KAFKA_TLS_KEY is not allowed: .*Secret' --set-string 'config.KAFKA_TLS_KEY=x'
          refuse 'config\.Kafka_Tls_Cert is not allowed' --set-string 'config.Kafka_Tls_Cert=x'
          refuse 'extraEnv kafka\.tls\.ca is not allowed: .*KAFKA_TLS_CA' --set-string kafka.profile=kafka-strimzi \
            --set-string 'extraEnv[0].name=kafka.tls.ca' --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=kafka-client-tls' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=ca.crt'
          # DocumentDB (fbx.propertyName / spring.data.mongodb.*, MONGODB_URI), as a config key and an extraEnv name.
          mreason='a spring\.data\.mongodb\.\* property'
          for name in SPRING_DATA_MONGODB_URI spring.data.mongodb.uri spring.data.mongo-db.uri 'spring.data[mongodb].uri' SPRING_DATA_MONGODB_SSL_ENABLED \
                      spring.data.mongodb.host SPRING_DATA_MONGODB_REPLICA_SET_NAME spring.data.mongodb.password spring.data.mongodb.database; do
            both "$name" "$mreason"
          done
          refuse 'config\.MONGODB_URI is not allowed: MONGODB_URI is the DocumentDB connection string' --set-string 'config.MONGODB_URI=mongodb://docdb.example.internal:27017/db?tls=false'
          refuse 'extraEnv MONGODB_URI must come from valueFrom\.secretKeyRef' --set-string 'extraEnv[0].name=MONGODB_URI' \
            --set-string 'extraEnv[0].value=mongodb://docdb.example.internal:27017/db?tlsAllowInvalidCertificates=true'
          refuse 'extraEnv MONGODB_URI must come from valueFrom\.secretKeyRef' --set-string 'extraEnv[0].name=MONGODB_URI' \
            --set-string 'extraEnv[0].valueFrom.configMapKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.key=uri'
          refuse 'extraEnv mongodb\.uri is not allowed: MONGODB_URI is the DocumentDB connection string' --set-string 'extraEnv[0].name=mongodb.uri' \
            --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=docdb-app' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=uri'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention .*mongodb' --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-DMONGODB_URI=mongodb://other.example.internal:27017/db'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention .*mongodb' --set-string 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Dspring.data.mongo-db.uri=mongodb://other.example.internal:27017/db'
          # The Secret-backed MONGODB_URI and the credential names the platform chart accepts still render.
          helm template ci "$chart" $args --show-only templates/deployment.yaml \
            --set-string 'extraEnv[0].name=MONGODB_URI' --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=docdb-app' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=uri' \
            | grep -A4 'name: MONGODB_URI' | grep -q 'secretKeyRef'
          helm template ci "$chart" $args --show-only templates/deployment.yaml \
            --set-string 'config.SPRING_DATA_MONGODB_USERNAME=of_app' --set-string 'extraEnv[0].name=spring_data_mongodb_username' --set-string 'extraEnv[0].value=of_app' \
            --set-string 'extraEnv[1].name=SPRING_DATA_MONGODB_PASSWORD' --set-string 'extraEnv[1].valueFrom.secretKeyRef.name=docdb' --set-string 'extraEnv[1].valueFrom.secretKeyRef.key=password' \
            | grep -q 'name: SPRING_DATA_MONGODB_PASSWORD'
          # Names with '_' inside an element: Spring Boot's property mapper drops it, so these bind the refused properties
          # (fbx.propertyName). The relaxed-binding canonical form does not.
          both spring.kafka.s_sl.trust-store-type "$kreason"
          both spring.kafka.consumer.s_sl.trust-store-type "$kreason"
          both spring.kafka.con_sumer.ssl.trust-store-type "$kreason"
          both spring.kafka.streams.pro_perties.ssl.truststore.location "$kreason"
          printf 'config:\n  spring.kafka.security.pro_tocol: PLAINTEXT\n' > "$tmp/proto.yaml"
          refuse 'config\.spring\.kafka\.security\.pro_tocol must be SASL_SSL' -f "$tmp/proto.yaml"
          refuse 'extraEnv spring\.kafka\.secu_rity\.protocol must set a literal value' --set-string 'extraEnv[0].name=spring.kafka.secu_rity.protocol' \
            --set-string 'extraEnv[0].valueFrom.configMapKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.key=protocol'
          both spring.data.mongo_db.host "$mreason"
          both spring.data.mongo_db.uri "$mreason"
          both spring.da_ta.mongodb.port "$mreason"
          both spring.pro_files.active 'a profile can activate'
          both spring.pro_files.default 'a profile can activate'
          both s_pring.profiles.active 'a profile can activate'
          both spring.con_fig.import 'a spring\.config\.\* property'
          both spring.applica_tion.json 'it can redirect or override the datasource'
          both spring.s_sl.bundle.pem.documentdb.truststore.certificate 'an SSL bundle property'
          both fintech_bankx.tls.enforce "it can switch off the service's startup TLS assertion"
          both fintechbankx.t_ls.enforce 'it can switch off'
          both spring.data_source.url 'it can redirect or override the datasource'
          both spring.data_source.driver-class-name 'it can redirect or override the datasource'
          both spring.fly_way.url 'it can redirect or override the datasource'
          # Other names with '_' inside an element, and the credential names, are not touched.
          helm template ci "$chart" $args --show-only templates/deployment.yaml \
            --set-string 'config.app\.feature_flags\.new_ui=true' --set-string 'config.logging\.level\.com_example_loan=DEBUG' \
            --set-string 'extraEnv[0].name=SPRING_DATASOURCE_USERNAME' --set-string 'extraEnv[0].value=mandates_app' \
            --set-string 'extraEnv[1].name=SPRING_DATA_MONGODB_PASSWORD' --set-string 'extraEnv[1].valueFrom.secretKeyRef.name=docdb' --set-string 'extraEnv[1].valueFrom.secretKeyRef.key=password' \
            | grep -q 'name: SPRING_DATA_MONGODB_PASSWORD'

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
