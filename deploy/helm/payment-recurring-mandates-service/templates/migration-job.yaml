{{- if .Values.migration.enabled }}
{{- /*
Flyway as a separate step (platform contract "Database roles"): runs before
every install and upgrade, as the schema owner, with the db-migration secret.
The service pods never mount that secret and run with SPRING_FLYWAY_ENABLED=false.
Both resources are hooks and are deleted once the hooks succeed, so the owner
credential (the ExternalSecret's target Secret, owned by it) leaves the
namespace with them. A failed Job stays for inspection until the next attempt.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mandates.migrationName" . }}
  labels:
    {{- include "mandates.externalSecretLabels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "mandates.migrationName" . }}
    creationPolicy: Owner
  data:
    - secretKey: DB_MIGRATION_USERNAME
      remoteRef:
        key: {{ include "mandates.remoteKey" (list "migration.remoteSecretName" .Values.migration.remoteSecretName .) }}
        property: username
    - secretKey: DB_MIGRATION_PASSWORD
      remoteRef:
        key: {{ include "mandates.remoteKey" (list "migration.remoteSecretName" .Values.migration.remoteSecretName .) }}
        property: password
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mandates.migrationName" . }}
  labels:
    {{- include "mandates.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      # Not the Deployment's selector labels: the Service, PDB, HPA and
      # NetworkPolicy must not select the migration pod.
      labels:
        app.kubernetes.io/name: {{ include "mandates.migrationName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db-migration
        fintechbankx.io/service-id: {{ index .Values.podLabels "fintechbankx.io/service-id" }}
        sidecar.istio.io/inject: {{ .Values.migration.istioSidecar | quote }}
      annotations:
        # A classic Istio sidecar never exits, so the Job would never
        # complete; see values migration.istioSidecar.
        sidecar.istio.io/inject: {{ .Values.migration.istioSidecar | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migration
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: DB_URL
              value: {{ .Values.config.DB_URL | quote }}
            # The runtime role V5 grants (Flyway placeholder runtime_role).
            - name: DB_USERNAME
              value: {{ .Values.config.DB_USERNAME | quote }}
          envFrom:
            - secretRef:
                name: {{ include "mandates.migrationName" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: {{ .Values.rdsCaBundle.mountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rds-ca-bundle
          configMap:
            name: {{ .Values.rdsCaBundle.configMapName }}
            items:
              - key: {{ .Values.rdsCaBundle.key }}
                path: {{ .Values.rdsCaBundle.key }}
{{- end }}
