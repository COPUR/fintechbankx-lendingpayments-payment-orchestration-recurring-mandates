name: publication-guardrails

on:
  pull_request:
  push:
    branches: ["main", "dev", "staging"]

permissions:
  contents: read

jobs:
  local-path-leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect local path or identity leakage
        run: |
          set -euo pipefail
          # ripgrep is pinned and checked before use, so a missing or failing rg is an error, never a clean scan.
          RG_DIR=$(mktemp -d)
          case "$(uname -m)" in
            x86_64)
              rg_asset=ripgrep-14.1.0-x86_64-unknown-linux-musl; rg_sha=f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7 ;;
            aarch64|arm64)
              rg_asset=ripgrep-14.1.0-aarch64-unknown-linux-gnu; rg_sha=c8c210b99844fbf16b7a36d1c963e8351bca5ff2dd7c788f5fba4ac18ba8c60d ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$RG_DIR/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/${rg_asset}.tar.gz"
          echo "${rg_sha}  $RG_DIR/rg.tar.gz" | sha256sum -c -
          tar -xz -C "$RG_DIR" -f "$RG_DIR/rg.tar.gz"
          export PATH="$RG_DIR/${rg_asset}:$PATH"
          command -v rg >/dev/null || { echo "ripgrep (rg) is required on this runner"; exit 1; }
          status=0
          rg -n "/Users/|\\\\Users\\\\|/home/|alicopur" . --glob '!**/.git/**' --glob '!**/build/**' --glob '!**/.gradle/**' --glob '!**/node_modules/**' || status=$?
          case $status in
            0) echo "Local path / identity leakage detected"; exit 1 ;;
            1) ;;
            *) echo "rg failed with exit $status"; exit "$status" ;;
          esac

  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan secret-like patterns
        run: |
          set -euo pipefail
          # ripgrep is pinned and checked before use, so a missing or failing rg is an error, never a clean scan.
          RG_DIR=$(mktemp -d)
          case "$(uname -m)" in
            x86_64)
              rg_asset=ripgrep-14.1.0-x86_64-unknown-linux-musl; rg_sha=f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7 ;;
            aarch64|arm64)
              rg_asset=ripgrep-14.1.0-aarch64-unknown-linux-gnu; rg_sha=c8c210b99844fbf16b7a36d1c963e8351bca5ff2dd7c788f5fba4ac18ba8c60d ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$RG_DIR/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/${rg_asset}.tar.gz"
          echo "${rg_sha}  $RG_DIR/rg.tar.gz" | sha256sum -c -
          tar -xz -C "$RG_DIR" -f "$RG_DIR/rg.tar.gz"
          export PATH="$RG_DIR/${rg_asset}:$PATH"
          command -v rg >/dev/null || { echo "ripgrep (rg) is required on this runner"; exit 1; }
          EXCLUDES=(--glob '!**/.git/**' --glob '!**/build/**' --glob '!**/.gradle/**' --glob '!**/node_modules/**')
          found=0

          # Key material and token formats: no placeholder exemption.
          status=0
          hits=$(rg -n 'BEGIN (RSA|EC|OPENSSH|PRIVATE KEY)|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|secret[_-]?key' . "${EXCLUDES[@]}") || status=$?
          case $status in
            0) echo "$hits"; found=1 ;;
            1) ;;
            *) echo "rg failed with exit $status"; exit "$status" ;;
          esac

          # A password value is tested one match at a time. An empty value, a placeholder (<name>, ${NAME}, ${NAME:}, ${NAME:-},
          # ${NAME:?message}, a nested ${...} default, var.name, env.NAME), an environment or Terraform reference (env(...),
          # System.getenv(...), a getter x.getPassword(), resource.name.attr), a Helm action {{ ... }} or a whole boolean (true or false)
          # is not a secret.
          # Any other value is reported, including a literal shell default such as ${NAME:-value} or ${NAME:=value}, a value
          # glued to a placeholder such as ${NAME}abc, and a key whose name ends in password (DB_PASSWORD, dbPassword, PGPASSWORD).
          PLACEHOLDER='password\s*[:=]\s*[\x22\x27]?(<[A-Za-z0-9_. -]+>|\$\{[A-Za-z_][A-Za-z0-9_.-]*(:(\$\{[A-Za-z0-9_.:-]*\})?|:-)?\}|\$\{[A-Za-z_][A-Za-z0-9_.-]*:\?[^\s}]*\}?|-\}|var\.[A-Za-z_][A-Za-z0-9_]*|env\.[A-Za-z_][A-Za-z0-9_]*|env\([^)]*\)|[A-Za-z_.]*[Gg]etenv\([^)]*\)|[A-Za-z_][A-Za-z0-9_.]*\.[Gg]et[A-Za-z0-9_]*\([^)]*\)|[a-z]+(_[a-z0-9]+)+\.[A-Za-z][A-Za-z0-9_-]*\.[a-z_]+|true|false|\{\{([^\s}]*\}\})?)?[\x22\x27]?\s*$'
          status=0
          values=$(rg -i -o -n '[A-Za-z0-9_.-]*password\s*[:=]\s*[^\s,;#\x60]*' . "${EXCLUDES[@]}") || status=$?
          case $status in
            0) ;;
            1) values= ;;
            *) echo "rg failed with exit $status"; exit "$status" ;;
          esac
          # Narrow exemptions for literal test values. One entry per line: the file path, a colon, then the matched text
          # as rg reports it, without the line number. Any other line still hits. Reasons, in the same order as the entries:
          # the runtime role is created with "if not exists", so a rerun against a persistent TEST_DB_URL needs a stable value (mandates PostgresTestDatabase).
          # the TEST_DB_PASSWORD fallback keeps the documented local command working when the variable is unset.
          # a deliberately wrong migration password that the migration must refuse; the value is not a credential.
          EXEMPT=$(mktemp)
          cat > "$EXEMPT" <<'EXEMPT_LIST'
          ./open-finance-bootstrap/src/test/java/com/enterprise/openfinance/recurringpayments/PostgresTestDatabase.java:RUNTIME_PASSWORD = "mandates_runtime_it"
          ./open-finance-bootstrap/src/test/java/com/enterprise/openfinance/recurringpayments/PostgresTestDatabase.java:ownerPassword = env("TEST_DB_PASSWORD"
          ./open-finance-bootstrap/src/test/java/com/enterprise/openfinance/recurringpayments/DatabaseMigrationIT.java:--DB_MIGRATION_PASSWORD=wrong-password"
          EXEMPT_LIST

          if [ -n "$values" ]; then
            status=0
            kept=$(printf '%s\n' "$values" | rg -v -i -e "$PLACEHOLDER") || status=$?
            case $status in
              0) ;;
              1) kept= ;;
              *) echo "rg failed with exit $status"; exit "$status" ;;
            esac
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              key=$(printf '%s' "$hit" | sed -E 's/^([^:]+):[0-9]+:/\1:/')
              if ! grep -qxF -- "$key" "$EXEMPT"; then
                echo "$hit"
                found=1
              fi
            done <<< "$kept"
          fi

          if [ "$found" -ne 0 ]; then
            echo "Potential secret pattern detected"
            exit 1
          fi

  readme-doc-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate README local links
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const files = [];
          const walk = (d) => {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              if (['.git','node_modules','build','.gradle'].includes(e.name)) continue;
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.name.toLowerCase() === 'readme.md') files.push(p);
            }
          };
          walk('.');
          let bad = 0;
          for (const file of files) {
            const txt = fs.readFileSync(file, 'utf8');
            for (const m of txt.matchAll(/\[[^\]]+\]\(([^)]+)\)/g)) {
              const link = m[1];
              const p = link.split('#')[0];
              if (!p || /^https?:\/\//.test(p) || /^mailto:/.test(p) || p.startsWith('#')) continue;
              const target = path.resolve(path.dirname(file), p);
              if (!fs.existsSync(target)) {
                console.error(file + ': missing link target -> ' + link);
                bad++;
              }
            }
          }
          if (bad > 0) process.exit(1);
          JS
