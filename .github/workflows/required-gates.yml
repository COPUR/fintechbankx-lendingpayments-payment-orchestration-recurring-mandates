name: Required Gates

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          ./gradlew --no-daemon clean assemble -x test

  test:
    name: ci/test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_pay_recurring_mandates_test
          POSTGRES_USER: mandates_test
          POSTGRES_PASSWORD: mandates_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandates_test -d db_pay_recurring_mandates_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # open-finance-bootstrap integration tests run Flyway and the whole service
      # against this database; with CI=true they fail (not skip) if it is missing.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/db_pay_recurring_mandates_test
      TEST_DB_USERNAME: mandates_test
      TEST_DB_PASSWORD: mandates_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TDD guard - production change needs a test change (ADR-029)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          NO_BEHAVIOUR_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-behaviour-change') }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          main_changed="$(printf '%s\n' "$changed" | grep -E '(^|/)src/main/' || true)"
          test_changed="$(printf '%s\n' "$changed" | grep -E '(^|/)src/test/' || true)"
          if [ -n "$main_changed" ] && [ -z "$test_changed" ]; then
            if [ "$NO_BEHAVIOUR_CHANGE" = "true" ]; then
              echo "src/main changed without src/test; allowed by label no-behaviour-change."
              exit 0
            fi
            echo "This PR changes src/main without touching src/test:"
            printf '%s\n' "$main_changed"
            echo "Add the failing test that drove the change, or label the PR no-behaviour-change."
            exit 1
          fi

      - name: Run tests and coverage gates
        run: ./gradlew --no-daemon clean check

      - name: Assert test execution produced reports
        shell: bash
        run: |
          report_count="$(find . -path '*/build/test-results/test/*.xml' | wc -l | tr -d ' ')"
          if [ "${report_count}" = "0" ]; then
            echo "No JUnit XML reports were generated. Refusing no-op green builds."
            exit 1
          fi

      - name: Build coverage trend report
        shell: bash
        run: node scripts/ci/coverage-trend.mjs

      - name: Upload coverage trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trend-${{ github.job }}-${{ github.run_id }}
          path: |
            build/reports/coverage/coverage-summary.json
            build/reports/coverage/coverage-summary.md

      - name: OpenAPI contract lint
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        run: npx -y @redocly/cli@1.27.1 lint api/openapi/*.yaml

      # ADR-019 section 5: the producer gates its own AsyncAPI file. CLI versions as in the
      # AsyncAPI catalog's workflow (Node 22, @asyncapi/cli 2.13.0, yaml 2.9.1).
      - name: AsyncAPI contract validation
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        run: |
          for spec in api/asyncapi/*.yaml; do
            npx -y @asyncapi/cli@2.13.0 validate "$spec"
          done

      - name: AsyncAPI breaking-change check
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          # Always main: versions count from the first merge to main; before that the spec is
          # pre-release and stays 1.0.0 (asyncapi-catalog README, "Change rules").
          BASE_REF: origin/main
          # The catalog script, unchanged, reads the spec directory from ASYNCAPI_DIR.
          ASYNCAPI_DIR: api/asyncapi
          NPM_CONFIG_CACHE: /tmp/.npm
        run: |
          npm install --no-save --no-package-lock yaml@2.9.1
          ./scripts/ci/asyncapi-breaking.sh

      - name: Install oasdiff
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSfL https://github.com/oasdiff/oasdiff/releases/download/v1.12.1/oasdiff_1.12.1_linux_amd64.tar.gz \
            | tar -xz -C "$tmpdir"
          sudo install "$tmpdir/oasdiff" /usr/local/bin/oasdiff
          rm -rf "$tmpdir"

      - name: OpenAPI breaking-change guard
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        run: ./scripts/ci/oasdiff-breaking.sh

      - name: FAPI/DPoP contract guard
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        run: ./scripts/ci/fapi-dpop-guard.sh

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          files="$(find . -path '*/src/main/java/*Controller.java')"
          if [ -z "$files" ]; then
            echo "No Java controller sources in this repository; guardrail check skipped."
            exit 0
          fi
          if grep -R -nE "Map<\s*String\s*,\s*Object\s*>" $files; then
            echo "Generic Map<String,Object> payloads are disallowed in controllers."
            exit 1
          fi

  security:
    name: ci/security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C "$tmpdir"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }
