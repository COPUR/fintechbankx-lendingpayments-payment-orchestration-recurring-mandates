{{- $required := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "OIDC_TOKEN_URI" "ACCOUNTS_SERVICE_BASE_URL" -}}
{{- range $key := $required }}
{{- $_ := required (printf "config.%s is required" $key) (index $.Values.config $key) }}
{{- end }}
{{- /* Round 6 guardrail 4a (see _helpers.tpl, mandates.validateValues): the vendored platform guard
     (_fbx-guard.tpl) parses every PostgreSQL JDBC URL the way PgJDBC does and refuses datasource,
     config and profile names; this chart adds the profile, TLS-switch and Kafka name rules. */ -}}
{{- include "mandates.validateValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mandates.name" . }}
  labels:
    {{- include "mandates.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # The Kafka profile in the image (kafka.profile, validated: kafka-msk or kafka-strimzi; never local).
  SPRING_PROFILES_ACTIVE: {{ include "mandates.kafkaProfile" . | quote }}
  # Micrometer common tags (platform convention): app = service account, squad = namespace.
  METRICS_TAG_APP: {{ .Values.serviceAccount.name | quote }}
  METRICS_TAG_SQUAD: {{ .Release.Namespace | quote }}
