name: Required Gates

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          ./gradlew --no-daemon clean assemble -x test

  test:
    name: ci/test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_pay_recurring_mandates_test
          POSTGRES_USER: mandates_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # Loopback only, on a random host port: another job on the shared fbx-ci Docker host cannot
          # reach this trust-auth database, and two jobs never claim the same port. Read in the first step.
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -U mandates_test -d db_pay_recurring_mandates_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # open-finance-bootstrap integration tests run Flyway and the whole service
      # against this database; with CI=true they fail (not skip) if it is missing.
      # TEST_DB_URL is set from the mapped port in the first step.
      TEST_DB_USERNAME: mandates_test
    steps:
      - name: Point tests at the service container's mapped port
        run: echo "TEST_DB_URL=jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/db_pay_recurring_mandates_test" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TDD guard - production change needs a test change (ADR-029)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          NO_BEHAVIOUR_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-behaviour-change') }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          main_changed="$(printf '%s\n' "$changed" | grep -E '(^|/)src/main/' || true)"
          test_changed="$(printf '%s\n' "$changed" | grep -E '(^|/)src/test/' || true)"
          if [ -n "$main_changed" ] && [ -z "$test_changed" ]; then
            if [ "$NO_BEHAVIOUR_CHANGE" = "true" ]; then
              echo "src/main changed without src/test; allowed by label no-behaviour-change."
              exit 0
            fi
            echo "This PR changes src/main without touching src/test:"
            printf '%s\n' "$main_changed"
            echo "Add the failing test that drove the change, or label the PR no-behaviour-change."
            exit 1
          fi

      - name: Run tests and coverage gates
        run: ./gradlew --no-daemon clean check

      - name: Assert test execution produced reports
        shell: bash
        run: |
          report_count="$(find . -path '*/build/test-results/test/*.xml' | wc -l | tr -d ' ')"
          if [ "${report_count}" = "0" ]; then
            echo "No JUnit XML reports were generated. Refusing no-op green builds."
            exit 1
          fi

      - name: Build coverage trend report
        shell: bash
        run: node scripts/ci/coverage-trend.mjs

      - name: Upload coverage trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trend-${{ github.job }}-${{ github.run_id }}
          path: |
            build/reports/coverage/coverage-summary.json
            build/reports/coverage/coverage-summary.md

      - name: OpenAPI contract lint
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        run: npx -y @redocly/cli@1.27.1 lint api/openapi/*.yaml

      # ADR-019 section 5: the producer gates its own AsyncAPI file. CLI versions as in the
      # AsyncAPI catalog's workflow (Node 22, @asyncapi/cli 2.13.0, yaml 2.9.1).
      - name: AsyncAPI contract validation
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        run: |
          for spec in api/asyncapi/*.yaml; do
            npx -y @asyncapi/cli@2.13.0 validate "$spec"
          done

      # The gate scripts and the common envelope are copies of the AsyncAPI catalog's at commit
      # 44837cc (README, "Event contract gate"); an edited copy fails here. Re-copy and update both lists together.
      - name: AsyncAPI gate scripts match the catalog copy
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        run: |
          sha256sum -c --strict - <<'SUMS'
          de255737fe6b54ffbadce8e030e18eec48d0137e0abd43c790fe201a10015eb1  scripts/ci/asyncapi-breaking.mjs
          5b39d588673c5f7ab55fcfa548fffd70b96ab9b11ea82bd2b61468dadb430c77  scripts/ci/asyncapi-breaking.sh
          212df6ca092e1ed5519664d7848c9de5fdb5d137f34faa3d31a25e3fe29b3847  scripts/ci/lib/asyncapi-model.mjs
          299e8731ccd365d8b1bccb698c3ae0e48812e1d2da85ed435680fcc7c61867ed  api/asyncapi/common/event-envelope.yaml
          SUMS

      - name: AsyncAPI breaking-change check
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          # Always main: versions count from the first merge to main; before that the spec is
          # pre-release and stays 1.0.0 (asyncapi-catalog README, "Change rules").
          BASE_REF: origin/main
          # The catalog script, unchanged, reads the spec directory from ASYNCAPI_DIR.
          ASYNCAPI_DIR: api/asyncapi
          NPM_CONFIG_CACHE: /tmp/.npm
        run: |
          npm install --no-save --no-package-lock yaml@2.9.1
          ./scripts/ci/asyncapi-breaking.sh

      - name: Install oasdiff
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Pick the asset by runner architecture and check it against the release's sha256 before extracting.
          case "$(uname -m)" in
            x86_64) oasdiff_arch=amd64; oasdiff_sha=85514a6044d9cce53816b3558b17be4f784e481e43bf345b1029a6ccc5c0e439 ;;
            aarch64|arm64) oasdiff_arch=arm64; oasdiff_sha=eff7c6d6d361fc29085925f6871d8b41406baadede6b87a4a055a2b640ac8a05 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/oasdiff.tar.gz" "https://github.com/oasdiff/oasdiff/releases/download/v1.12.1/oasdiff_1.12.1_linux_${oasdiff_arch}.tar.gz"
          echo "${oasdiff_sha}  $tmpdir/oasdiff.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/oasdiff.tar.gz"
          sudo install "$tmpdir/oasdiff" /usr/local/bin/oasdiff
          rm -rf "$tmpdir"

      - name: OpenAPI breaking-change guard
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        run: ./scripts/ci/oasdiff-breaking.sh

      - name: FAPI/DPoP contract guard
        if: ${{ hashFiles('api/openapi/*.yaml') != '' }}
        run: ./scripts/ci/fapi-dpop-guard.sh

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          files="$(find . -path '*/src/main/java/*Controller.java')"
          if [ -z "$files" ]; then
            echo "No Java controller sources in this repository; guardrail check skipped."
            exit 0
          fi
          if grep -R -nE "Map<\s*String\s*,\s*Object\s*>" $files; then
            echo "Generic Map<String,Object> payloads are disallowed in controllers."
            exit 1
          fi

  security:
    name: ci/security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Pick the asset by runner architecture and check it against the release's sha256 before extracting.
          case "$(uname -m)" in
            x86_64) gitleaks_arch=x64; gitleaks_sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) gitleaks_arch=arm64; gitleaks_sha=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_${gitleaks_arch}.tar.gz"
          echo "${gitleaks_sha}  $tmpdir/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/gitleaks.tar.gz"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }
